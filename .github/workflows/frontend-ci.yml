name: Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: Bundle mobile
        run: npm run build:mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8080